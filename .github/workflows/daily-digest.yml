name: 工作日中国新闻日报

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5" # 北京时间工作日 09:00

permissions:
  contents: write

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成 HTML 日报
        run: python scripts/generate_digest.py
      - name: 提交最新报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: 更新中国新闻日报" || exit 0
          git push
      - name: 推送企业微信群
        env:
          WECHAT_WORK_WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/send_wecom.py
